<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>macui top bar</title>
    <!-- Diagnostics channel. These windows have no console a user can open, and wry
         does not mirror document.title onto the native window, so a load or runtime
         failure here is otherwise completely silent. Report it into the app's own
         log file, which can be read from outside. -->
    <script>
      window.__diag = [];
      function __report(kind, msg) {
        window.__diag.push(kind + ": " + msg);
        try {
          window.__TAURI_INTERNALS__.invoke("cmd_log", { msg: "[topbar] " + kind + ": " + msg });
        } catch (e) {}
      }
      addEventListener(
        "error",
        function (e) {
          if (e.target && e.target !== window && e.target.tagName) {
            __report("LOAD-FAIL", e.target.tagName + " " + (e.target.src || e.target.href));
          } else {
            __report("ERR", e.message + " @" + e.lineno);
          }
        },
        true,
      );
      addEventListener("unhandledrejection", function (e) {
        __report("REJECT", String(e.reason));
      });
    </script>
    <link rel="stylesheet" href="./shared/theme.css" />
    <link rel="stylesheet" href="./topbar/topbar.css" />
  </head>
  <body>
    <div class="bar hidden no-anim" id="bar">
      <!-- Left: the app the user is currently working in.
           Hidden unless switched on in settings - it repeats what the window in
           front of you already says. -->
      <button id="app-pill" class="pill glass left" type="button" aria-live="polite" hidden>
        <img id="app-icon" class="app-icon" alt="" hidden />
        <span id="app-name" class="label">Desktop</span>
      </button>

      <!-- Centre: the island.
           Collapsed it is the clock. Hovering expands it to whatever is playing;
           it also expands by itself for a few seconds when the volume changes, the
           charger goes in or out, or the track changes, then collapses again.
           Clicking opens the calendar panel. -->
      <div id="island" class="island centre" data-state="idle">
        <button id="clock-pill" class="pill glass island-pill" type="button"
                aria-label="Calendar">
          <span class="island-lead" id="island-lead" aria-hidden="true"></span>
          <span id="clock" class="label"></span>
          <span class="island-trail" id="island-trail" aria-hidden="true"></span>
        </button>

        <div class="island-body glass" id="island-body" aria-hidden="true">
          <div class="np">
            <div class="np-art" id="np-art"></div>
            <div class="np-meta">
              <div class="np-title" id="np-title">Nothing playing</div>
              <div class="np-artist" id="np-artist"></div>
              <div class="np-controls">
                <button id="np-prev" type="button" aria-label="Previous track"></button>
                <button id="np-play" type="button" aria-label="Play or pause"></button>
                <button id="np-next" type="button" aria-label="Next track"></button>
              </div>
            </div>
          </div>
          <div class="np-activity" id="np-activity" hidden>
            <span class="act-icon" id="act-icon"></span>
            <span class="act-text" id="act-text"></span>
            <span class="act-meter"><i id="act-bar"></i></span>
          </div>
        </div>
      </div>

      <!-- Right: status. Each control opens the real Windows Quick Settings. -->
      <div id="status-pill" class="pill glass right">
        <button id="tray-chevron" class="icon-btn" type="button"
                title="Show hidden tray icons">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5"
            fill="none" stroke="currentColor" stroke-width="1.6"
            stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="net-btn" class="icon-btn" type="button" title="Network"></button>
        <button id="bt-btn" class="icon-btn" type="button" title="Bluetooth"></button>
        <button id="vol-btn" class="icon-btn" type="button"
                title="Volume — scroll to change"></button>
        <button id="batt-btn" class="icon-btn batt" type="button" title="Battery">
          <span id="batt-glyph" class="batt-glyph"><i id="batt-fill"></i></span>
          <span id="batt-pct" class="batt-pct"></span>
        </button>
      </div>
    </div>
    <script type="module" src="./topbar/topbar.ts"></script>
  </body>
</html>
