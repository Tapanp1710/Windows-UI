<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>macui switcher</title>
    <script>
      window.__diag = [];
      function __report(kind, msg) {
        window.__diag.push(kind + ": " + msg);
        try {
          window.__TAURI_INTERNALS__.invoke("cmd_log", { msg: "[switcher] " + kind + ": " + msg });
        } catch (e) {}
      }
      addEventListener(
        "error",
        function (e) {
          if (e.target && e.target !== window && e.target.tagName) {
            __report("LOAD-FAIL", e.target.tagName + " " + (e.target.src || e.target.href));
          } else {
            __report("ERR", e.message + " @" + e.lineno);
          }
        },
        true,
      );
      addEventListener("unhandledrejection", function (e) {
        __report("REJECT", String(e.reason));
      });
    </script>
    <link rel="stylesheet" href="./shared/theme.css" />
    <link rel="stylesheet" href="./switcher/switcher.css" />
  </head>
  <body>
    <!-- A glass disc with the open windows on a ring around its rim, and the
         selected one's live preview in the middle. The preview is drawn by DWM
         over this page, into the empty #shot hole; nothing painted there shows. -->
    <div class="stage">
      <div class="disc glass" id="disc">
        <div class="track" aria-hidden="true"></div>
        <div class="ring" id="ring"></div>
        <div class="centre">
          <div class="shot" id="shot"></div>
          <div class="caption" id="caption"></div>
          <div class="count" id="count"></div>
        </div>
      </div>
    </div>
    <script type="module" src="./switcher/switcher.ts"></script>
  </body>
</html>
