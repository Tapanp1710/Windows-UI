<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>macui dock</title>
    <!-- Diagnostics channel: these windows have no console a user can open, so any
         load or runtime failure is surfaced through the window title, which can be
         read from outside with GetWindowTextW. Cheap, and it survives release builds. -->
    <script>
      window.__diag = [];
      function __report(kind, msg) {
        window.__diag.push(kind + ": " + msg);
        document.title = "macui dock [" + window.__diag.join(" | ").slice(0, 180) + "]";
        // wry does not mirror document.title onto the native window, so the title
        // above cannot be read from outside. The app's own log file can.
        try {
          window.__TAURI_INTERNALS__.invoke("cmd_log", { msg: "[dock] " + kind + ": " + msg });
        } catch (e) {}
      }
      addEventListener(
        "error",
        function (e) {
          if (e.target && e.target !== window && e.target.tagName) {
            __report("LOAD-FAIL", e.target.tagName + " " + (e.target.src || e.target.href));
          } else {
            __report("ERR", e.message + " @" + e.lineno);
          }
        },
        true,
      );
      addEventListener("unhandledrejection", function (e) {
        __report("REJECT", String(e.reason));
      });
      addEventListener("DOMContentLoaded", function () {
        if (!window.__diag.length) document.title = "macui dock [html-parsed]";
      });
    </script>
    <link rel="stylesheet" href="./shared/theme.css" />
    <link rel="stylesheet" href="./dock/dock.css" />
  </head>
  <body>
    <!-- The slide-up/down wrapper. The window itself never animates; moving a
         Win32 window every frame is where dock jank comes from.

         Starts in the CONCEALED state on purpose. The Rust sampler also starts
         concealed and only emits on a *change*, so if this started revealed the two
         would disagree until the first full reveal-then-leave cycle, and a freshly
         started dock would sit there permanently visible. -->
    <div id="slider" class="slider hidden no-anim">
      <div id="dock" class="dock glass" role="toolbar" aria-label="Dock">
        <div id="items" class="items"></div>

        <!-- The tray. Everything that used to live in the top bar now sits at the
             right-hand end of this same pill, so there is one bar at the bottom
             rather than two bars on opposite edges. It is inside the dock's own
             element on purpose: the dock window is sized to its content, so the
             tray widens the window and needs no hit-test region of its own - which
             is what made the top bar take a second to appear (D-038). -->
        <div id="tray-sep" class="tray-sep" hidden></div>
        <div id="tray" class="tray" hidden>
          <button id="tray-shelf" class="tray-btn shelf-btn" type="button" aria-label="Shelf" hidden>
            <span class="tray-ico" id="ico-shelf"></span>
            <span class="shelf-count" id="shelf-count">0</span>
          </button>
          <button id="tray-status" class="tray-btn tray-status" type="button" aria-label="Network, sound and battery">
            <span class="tray-ico" id="ico-wifi"></span>
            <span class="tray-ico" id="ico-bt"></span>
            <span class="tray-ico" id="ico-vol"></span>
            <span class="tray-ico tray-batt" id="ico-batt"></span>
          </button>
          <button id="tray-clock" class="tray-btn tray-clock" type="button" aria-label="Date and time">
            <span id="clock-time">--:--</span>
            <span id="clock-date" class="clock-date">---</span>
          </button>
        </div>
      </div>
    </div>
    <div id="tooltip" class="tooltip" role="tooltip" aria-hidden="true"></div>
    <div id="menu" class="menu" role="menu"></div>
    <script type="module" src="./dock/dock.ts"></script>
  </body>
</html>
