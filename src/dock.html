<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>macui dock</title>
    <!-- Diagnostics channel: these windows have no console a user can open, so any
         load or runtime failure is surfaced through the window title, which can be
         read from outside with GetWindowTextW. Cheap, and it survives release builds. -->
    <script>
      window.__diag = [];
      function __report(kind, msg) {
        window.__diag.push(kind + ": " + msg);
        document.title = "macui dock [" + window.__diag.join(" | ").slice(0, 180) + "]";
      }
      addEventListener(
        "error",
        function (e) {
          if (e.target && e.target !== window && e.target.tagName) {
            __report("LOAD-FAIL", e.target.tagName + " " + (e.target.src || e.target.href));
          } else {
            __report("ERR", e.message + " @" + e.lineno);
          }
        },
        true,
      );
      addEventListener("unhandledrejection", function (e) {
        __report("REJECT", String(e.reason));
      });
      addEventListener("DOMContentLoaded", function () {
        if (!window.__diag.length) document.title = "macui dock [html-parsed]";
      });
    </script>
    <link rel="stylesheet" href="./shared/theme.css" />
    <link rel="stylesheet" href="./dock/dock.css" />
  </head>
  <body>
    <!-- The slide-up/down wrapper. The window itself never animates; moving a
         Win32 window every frame is where dock jank comes from. -->
    <div id="slider" class="slider">
      <div id="dock" class="dock glass" role="toolbar" aria-label="Dock">
        <div id="items" class="items"></div>
      </div>
    </div>
    <div id="tooltip" class="tooltip" role="tooltip" aria-hidden="true"></div>
    <script type="module" src="./dock/dock.ts"></script>
  </body>
</html>
