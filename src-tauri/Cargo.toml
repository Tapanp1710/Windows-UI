[package]
name = "macui"
version = "0.1.0"
edition = "2021"
description = "macOS-inspired visual layer for Windows"
default-run = "macui"

[features]
# Tauri computes `dev = !custom_protocol`. Without this feature a `cargo build
# --release` still produces a *dev* binary that loads `devUrl` (the Vite server)
# instead of the assets embedded in the exe - which looks exactly like a silently
# blank window. `npm run tauri build` passes this automatically; plain cargo needs
# `--features custom-protocol`.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# PNG encoding for the icons we pull out of the shell as raw BGRA bitmaps.
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"

[dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_System_Com",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_LibraryLoader",
  "Win32_UI_Controls",
  "Win32_Security",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
